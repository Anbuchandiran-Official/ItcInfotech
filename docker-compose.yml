services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: itc_secure_login
      POSTGRES_USER: itc
      POSTGRES_PASSWORD: itc
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itc -d itc_secure_login"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
