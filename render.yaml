services:
  - type: web
    name: itc-secure-login
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_SERVICE_ACCOUNT_JSON_B64
        sync: false
      - key: REDIS_URL
        fromService:
          name: itc-secure-login-cache
          type: keyvalue
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TOTP_ENCRYPTION_KEY
        generateValue: true
      - key: APP_ORIGIN
        fromService:
          name: itc-secure-login
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: keyvalue
    name: itc-secure-login-cache
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []

